# PR 이 열리거나 업데이트되면 문서 사이트 빌드 + 라이브러리 빌드가 통과하는지 확인합니다.
name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build docs (Next.js, 타입 체크 포함)
        run: npm run build
      - name: Build library
        run: npm run build:lib
      - name: Check package contents
        run: npm pack -w @songyeonji/prebuilt-ui --dry-run
