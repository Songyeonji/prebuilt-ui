# main 에 커밋이 들어오면(push / PR 머지) 빌드 검사 후 Vercel Production 에 배포합니다.
#
# 필요한 GitHub Secrets (Settings → Secrets and variables → Actions → Repository secrets):
#   VERCEL_TOKEN       : https://vercel.com/account/tokens 에서 발급 (Scope = 프로젝트가 속한 팀)
#   VERCEL_ORG_ID      : `npx vercel link` 후 .vercel/repo.json(또는 project.json) 의 orgId
#   VERCEL_PROJECT_ID  : 같은 파일의 id(projectId)
name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Secret 값에 실수로 들어간 앞뒤 공백/줄바꿈/따옴표를 제거해서 이후 단계에서 사용
      - name: Prepare Vercel credentials
        env:
          RAW_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          RAW_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          RAW_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          clean() { printf '%s' "$1" | tr -d "[:space:]\"'"; }
          for pair in VERCEL_TOKEN:RAW_TOKEN VERCEL_ORG_ID:RAW_ORG_ID VERCEL_PROJECT_ID:RAW_PROJECT_ID; do
            name=${pair%%:*}; raw_var=${pair##*:}; raw=${!raw_var}; value=$(clean "$raw")
            if [ -z "$value" ]; then echo "::error::GitHub Secret '$name' 이 비어 있습니다."; exit 1; fi
            if [ "$value" != "$raw" ]; then echo "::warning::'$name' 값에 공백/따옴표가 섞여 있어 제거했습니다. Secret 을 다시 저장해 두세요."; fi
            [ "$name" = VERCEL_TOKEN ] && echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      # 토큰/팀/프로젝트 조합이 맞는지 먼저 확인하고, 틀리면 무엇이 틀렸는지 로그에 남깁니다.
      - name: Verify Vercel access
        run: |
          api() { curl -s -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com$1"; }

          user=$(api /v2/user | jq -r '.user.username // ("❌ " + .error.message)')
          echo "토큰 소유자: $user"
          echo "이 토큰으로 접근 가능한 팀:"
          api /v2/teams | jq -r '.teams[]? | "  - \(.name) (\(.slug))  id=\(.id)"'
          echo "사용하려는 ORG_ID: $VERCEL_ORG_ID / PROJECT_ID: $VERCEL_PROJECT_ID"

          # vercel CLI 는 pull/deploy 때 "팀 조회"와 "프로젝트 조회"를 둘 다 하고, 둘 중 하나라도 403 이면
          # "Could not retrieve Project Settings" 로 실패합니다 → 두 가지를 모두 확인
          fail=0
          team=$(api "/v2/teams/$VERCEL_ORG_ID")
          if echo "$team" | jq -e '.id' > /dev/null; then
            echo "✅ 팀 조회: $(echo "$team" | jq -r '.name + " (" + .slug + ")"')"
          else
            echo "::error::팀 조회 실패 → $(echo "$team" | jq -r '(.error.code // "") + ": " + (.error.message // "")')"
            fail=1
          fi

          res=$(api "/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID")
          if echo "$res" | jq -e '.id' > /dev/null; then
            echo "✅ 프로젝트 조회: $(echo "$res" | jq -r '.name')"
          else
            echo "::error::프로젝트 조회 실패 → $(echo "$res" | jq -r '(.error.code // "") + ": " + (.error.message // "")')"
            fail=1
          fi

          if [ "$fail" = 1 ]; then
            echo "::error::토큰이 이 팀에 권한이 없습니다. vercel.com/account/tokens 에서 Scope 를 이 팀으로 선택해 토큰을 새로 만들고 VERCEL_TOKEN 만 교체하세요."
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      # next build 가 타입 체크까지 수행합니다. 실패하면 배포되지 않습니다.
      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### 🚀 배포 완료: $url" >> "$GITHUB_STEP_SUMMARY"
