# 라이브러리(@songyeonji/prebuilt-ui)를 npm 에 배포합니다.
#
# 배포 방법:
#   1) src/shared/package.json 의 version 을 올린다 (예: 0.1.0 → 0.2.0)
#   2) 커밋 후 같은 버전으로 태그를 푸시한다
#        git tag v0.2.0 && git push origin v0.2.0
#
# 필요한 GitHub Secret:
#   NPM_TOKEN : npmjs.com → Access Tokens → Generate New Token (Granular, 이 패키지 Read and write)
name: Release to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance (패키지가 이 저장소에서 빌드됐음을 증명)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pkg_version=$(node -p "require('./src/shared/package.json').version")
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "::error::태그(v$tag_version)와 src/shared/package.json 버전($pkg_version)이 다릅니다."
            exit 1
          fi

      - name: Build library
        run: npm run build:lib

      - name: Publish
        run: npm publish -w @songyeonji/prebuilt-ui
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
